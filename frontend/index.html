<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Plagiarism Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>AI Plagiarism Checker</h1>
    </header>
    <main>
        <div id="auth-section">
            <h2>Authentication</h2>
            <div id="signup-form">
                <h3>Signup</h3>
                <label for="signup-email">Email:</label>
                <input type="email" id="signup-email" placeholder="your@email.com" required>
                <label for="signup-password">Password:</label>
                <input type="password" id="signup-password" placeholder="Password" required>
                <button id="signup-button">Signup</button>
            </div>
            <hr>
            <div id="login-form">
                <h3>Login</h3>
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" placeholder="your@email.com" required>
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" placeholder="Password" required>
                <button id="login-button">Login</button>
            </div>
            <div id="user-info" style="display:none;">
                <p>Logged in as: <strong id="user-email-display"></strong></p>
                <button id="logout-button">Logout</button>
            </div>
        </div>

        <div id="checker-section" style="display:none;">
            <h2>Check Content for Plagiarism</h2>

            <div id="text-check-form" class="check-type-form">
                <h3>Check Text</h3>
                <textarea id="text-input" rows="10" cols="60" placeholder="Paste your text here..."></textarea><br>
                <button id="check-text-button">Check Text</button>
            </div>
            <hr>
            <div id="file-check-form" class="check-type-form">
                <h3>Check Text File (txt, pdf, docx)</h3>
                <label for="text-file-input">Upload Text File:</label>
                <input type="file" id="text-file-input" accept=".txt,.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
                <button id="check-text-file-button">Check Text File</button>
            </div>
            <hr>
            <div id="image-check-form" class="check-type-form">
                <h3>Check Image File (jpg, png, gif)</h3>
                <label for="image-file-input">Upload Image File:</label>
                <input type="file" id="image-file-input" accept="image/jpeg,image/png,image/gif">
                <button id="check-image-file-button">Check Image File</button>
            </div>
            <hr>
            <div id="video-check-form" class="check-type-form">
                <h3>Check Video File (mp4)</h3>
                <label for="video-file-input">Upload Video File:</label>
                <input type="file" id="video-file-input" accept="video/mp4">
                <button id="check-video-file-button">Check Video File</button>
            </div>
        </div>

        <div id="results-section">
            <h2>Results</h2>
            <div id="report-output">
                <p>Please log in and submit content to see results.</p>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 AI Plagiarism Checker</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
